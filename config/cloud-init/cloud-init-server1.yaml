#cloud-config
# Configuración cloud-init de server1-g3 (DNS maestro).
# No contiene usuarios, contraseñas, tokens ni claves privadas.
hostname: server1-g3
preserve_hostname: false
manage_etc_hosts: true

package_update: true
packages:
  - openssh-server
  - bind9

write_files:
  - path: /etc/netplan/50-cloud-init.yaml
    owner: root:root
    permissions: "0644"
    content: |
      network:
        version: 2
        ethernets:
          ens18:
            dhcp4: false
            addresses:
              - 192.168.3.101/24
            routes:
              - to: default
                via: 192.168.3.1
            nameservers:
              addresses:
                - 192.168.3.101
                - 192.168.3.102

runcmd:
  - chmod 600 /etc/netplan/60-static.yaml
  - netplan generate
  - netplan apply
  - systemctl enable --now bind9
