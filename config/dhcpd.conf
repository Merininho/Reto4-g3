# Plantilla de configuración de ISC DHCP
# Sustituir red, máscara, dominio y servidores DNS por los valores reales.

default-lease-time 600;
max-lease-time 7200;

option domain-name "ejemplo.local";
option domain-name-servers PENDIENTE_DNS;

subnet PENDIENTE_RED netmask PENDIENTE_MASCARA {
    range PENDIENTE_INICIO PENDIENTE_FIN;
    option routers PENDIENTE_ROUTER;
    option broadcast-address PENDIENTE_BROADCAST;
}
