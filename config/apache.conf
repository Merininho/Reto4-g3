# VirtualHost del servidor web principal (server3-g3, 192.168.3.103).
# El puerto 3880 del firewall se redirige al puerto 80 de este servidor.

<VirtualHost *:80>
    ServerName www.grupo3reto4.eus
    ServerAlias grupo3reto4.eus
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/grupo3reto4-error.log
    CustomLog ${APACHE_LOG_DIR}/grupo3reto4-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
    <VirtualHost _default_:443>
        ServerName www.intranet.grupo3reto4.eus
        ServerAlias grupo3reto4.eus
        DocumentRoot /var/www/html

        <Directory /var/www/html>
            Require all granted
        </Directory>

        SSLEngine on
        SSLCertificateFile /etc/ssl/certs/grupo3reto4.crt
        SSLCertificateKeyFile /etc/ssl/private/grupo3reto4.key

        ErrorLog ${APACHE_LOG_DIR}/grupo3reto4-ssl-error.log
        CustomLog ${APACHE_LOG_DIR}/grupo3reto4-ssl-access.log combined
    </VirtualHost>
</IfModule>
