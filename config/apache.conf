# VirtualHost Apache de ejemplo.
# Sustituir PENDIENTE_IP y las rutas por valores reales.

<VirtualHost PENDIENTE_IP:80>
    ServerName PENDIENTE_DNS
    DocumentRoot /var/www/PENDIENTE_WEB

    <Directory /var/www/PENDIENTE_WEB>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/pendiente-error.log
    CustomLog ${APACHE_LOG_DIR}/pendiente-access.log combined
</VirtualHost>
