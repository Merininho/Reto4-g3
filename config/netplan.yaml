# Ejemplo Netplan. Antes de aplicar, validar con: sudo netplan generate
network:
  version: 2
  ethernets:
    PENDIENTE_INTERFAZ:
      dhcp4: false
      addresses:
        - PENDIENTE_IP/PENDIENTE_PREFIJO
      routes:
        - to: default
          via: PENDIENTE_GATEWAY
      nameservers:
        addresses:
          - PENDIENTE_DNS
